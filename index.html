<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>어바웃알파 대시보드</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
  background:#F1F5F9;color:#0F172A;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── Header ── */
.hdr{background:linear-gradient(150deg,#0F172A 0%,#1E3A5F 60%,#1D4ED8 100%);
  color:#fff;padding:24px 20px 0;position:sticky;top:0;z-index:10}
.hdr-brand{font-size:11px;font-weight:600;letter-spacing:2px;opacity:.55;text-transform:uppercase}
.hdr-month{font-size:24px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.hdr-updated{font-size:10px;opacity:.4;margin-top:3px;padding-bottom:10px}

/* ── Month nav ── */
.mnav{display:flex;gap:6px;overflow-x:auto;padding:10px 20px 14px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.mnav::-webkit-scrollbar{display:none}
.mpill{flex-shrink:0;background:rgba(255,255,255,.15);color:rgba(255,255,255,.65);
  border:none;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;
  cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.mpill.active{background:#fff;color:#1D4ED8}

/* ── Layout ── */
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 48px}
.slabel{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:#94A3B8;margin:22px 0 10px 2px}

/* ── KPI grid ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border-radius:16px;padding:18px 16px;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05)}
.kpi-label{font-size:12px;font-weight:600;color:#64748B}
.kpi-row{display:flex;align-items:baseline;gap:2px;margin-top:6px}
.kpi-num{font-size:26px;font-weight:800;line-height:1;letter-spacing:-1px}
.kpi-unit{font-size:13px;font-weight:500;color:#94A3B8}
.note{font-size:10px;font-weight:600;color:#F59E0B;background:#FEF3C7;
  padding:1px 5px;border-radius:4px;vertical-align:middle}

/* ── Brand card ── */
.card{background:#fff;border-radius:18px;padding:18px;margin-top:10px;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05)}
.card-name{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-bottom:14px}
.bgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.bm{text-align:center;padding:10px 4px;border-radius:10px;background:#F8FAFC}
.bm-label{font-size:11px;color:#94A3B8;font-weight:600;margin-bottom:4px}
.bm-row{display:flex;align-items:baseline;justify-content:center;gap:1px}
.bm-num{font-size:16px;font-weight:800;letter-spacing:-.4px}
.bm-unit{font-size:11px;font-weight:500;color:#94A3B8}

/* ── Inventory section ── */
.inv-inner{border-top:1px solid #F1F5F9;margin-top:14px;padding-top:14px}
.inv-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.inv-row:last-child{margin-bottom:0}
.inv-lbl{font-size:11px;font-weight:600;color:#94A3B8;min-width:52px;padding-top:3px}
.inv-body{flex:1}
.inv-main{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.inv-num{font-size:20px;font-weight:900;color:#4338CA;letter-spacing:-.5px;line-height:1}
.inv-unit{font-size:11px;color:#94A3B8;font-weight:500}
.dep-badge{font-size:11px;font-weight:600;color:#fff;background:#6366F1;
  padding:2px 7px;border-radius:10px;white-space:nowrap}

/* ── RG detail lines ── */
.rg-line{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.rg-line:last-child{margin-bottom:0}
.rg-size{font-size:11px;font-weight:600;color:#6366F1;min-width:38px}
.rg-qty{font-size:15px;font-weight:800;color:#4338CA;letter-spacing:-.3px}
.rg-qunit{font-size:11px;color:#94A3B8;font-weight:500}
.rg-arrow{font-size:11px;color:#CBD5E1;margin:0 2px}
.rg-dep{font-size:11px;font-weight:700;color:#fff;background:#10B981;
  padding:2px 7px;border-radius:10px}
.rg-dep.warn{background:#F59E0B}
.rg-dep.danger{background:#EF4444}
.empty-dash{color:#CBD5E1;font-size:13px}

/* ── 채널(총매출/쿠팡/카페24) ── */
.total-main{background:linear-gradient(135deg,#EFF6FF,#fff);border:1px solid #DBEAFE}
.ch-sub{font-size:12px;color:#64748B;margin-top:8px}
.ch-sub b{color:#1D4ED8}
.ch-tabs{display:flex;gap:8px;margin-top:16px}
.ch-tab{flex:1;padding:12px;border:1px solid #E2E8F0;background:#fff;border-radius:12px;
  font-size:14px;font-weight:700;color:#475569;cursor:pointer;transition:all .15s;
  -webkit-tap-highlight-color:transparent}
.ch-tab.active{background:#1D4ED8;color:#fff;border-color:#1D4ED8}
.ch-section{margin-top:6px}

/* ── Footer ── */
.footer{text-align:center;color:#CBD5E1;font-size:11px;padding-top:28px}
</style>

function fmt(n) {
  return Math.round(n / 10000).toLocaleString('ko-KR');
}

function colorFor(n) {
  return n >= 0 ? '#10B981' : '#EF4444';
}

// "2026-06-28" → "6/28", 빈값 → null
function parseDep(s) {
  if (!s) return null;
  const p = s.split('-');
  if (p.length === 3) return { label: parseInt(p[1]) + '/' + parseInt(p[2]), date: new Date(s) };
  return null;
}

// 소진까지 남은 일수 → 색상 (30일 이하=빨, 60일 이하=주황, 이상=초록)
function depClass(dateObj) {
  if (!dateObj) return '';
  const days = Math.round((dateObj - new Date()) / 86400000);
  if (days <= 30) return 'danger';
  if (days <= 60) return 'warn';
  return '';
}

function renderInv(prefix, inv, sizes) {
  const closingEl = document.getElementById(prefix + '-closing');
  const rgEl      = document.getElementById(prefix + '-rg-detail');

  closingEl.textContent = inv.closing.toLocaleString('ko-KR');

  let html = '';
  let hasAny = false;
  for (const s of sizes) {
    const qty = inv.rg_stocks[String(s)] || 0;
    if (!qty) continue;
    hasAny = true;
    const dep = parseDep(inv.rg_depletions[String(s)]);
    const depHtml = dep
      ? `<span class="rg-arrow">→</span><span class="rg-dep ${depClass(dep.date)}">${dep.label}</span>`
      : '';
    html += `<div class="rg-line">
      <span class="rg-size">${s}개팩</span>
      <span class="rg-qty">${qty.toLocaleString('ko-KR')}</span><span class="rg-qunit">개</span>
      ${depHtml}
    </div>`;
  }
  rgEl.innerHTML = hasAny ? html : '<span class="empty-dash">-</span>';
}

function renderMonth(ym) {
  const d = DATA.data[ym];
  if (!d) return;
  const isCurrent = (ym === DATA.current_ym);

  // 헤더 월 표시
  const y = ym.slice(0,4), m = parseInt(ym.slice(5,7));
  document.getElementById('hdr-month').textContent = y + '년 ' + m + '월 대시보드';

  // 총매출 (쿠팡 + 카페24)
  const coupangSale = d.total.sale, cafe24Total = d.cafe24_total || 0;
  document.getElementById('k-grand').textContent          = fmt(coupangSale + cafe24Total);
  document.getElementById('ch-coupang-sum').textContent   = fmt(coupangSale);
  document.getElementById('ch-cafe24-sum').textContent    = fmt(cafe24Total);

  // 카페24 섹션
  const cf = d.cafe24 || {};
  document.getElementById('cf-total').textContent = fmt(cafe24Total);
  document.getElementById('cf-ba').textContent    = fmt(cf['블랙알파'] || 0);
  document.getElementById('cf-sx').textContent    = fmt(cf['세라펙스'] || 0);
  document.getElementById('cf-ru').textContent    = fmt(cf['루티움'] || 0);

  // 쿠팡 KPI
  document.getElementById('k-sale').textContent      = fmt(d.total.sale);
  document.getElementById('k-ad').textContent        = fmt(d.total.ad);
  document.getElementById('k-totalcost').textContent = fmt(d.total.total_cost);
  const kNet = document.getElementById('k-net');
  kNet.textContent = fmt(d.total.net);
  kNet.style.color = colorFor(d.total.net);
  document.getElementById('k-margin').textContent    = d.total.margin;
  document.getElementById('k-ad-label').innerHTML    = d.total.ad > 0 ? '광고비' : '광고비 <span class="note">미입력</span>';

  // 브랜드별
  for (const [b, p] of [['blackalpha','ba'],['serapex','sx']]) {
    const bd = d[b];
    document.getElementById(p+'-sale').textContent = fmt(bd.sale);
    document.getElementById(p+'-ad').textContent   = fmt(bd.ad);
    const bNet = document.getElementById(p+'-net');
    bNet.textContent = fmt(bd.net);
    bNet.style.color = colorFor(bd.net);
    document.getElementById(p+'-ad-label').innerHTML = bd.ad > 0 ? '광고비' : '광고비 <span class="note">미입력</span>';

    // 재고 (현재 월만)
    const invEl = document.getElementById(p+'-inv');
    if (isCurrent) {
      invEl.style.display = '';
      renderInv(p, bd.inv, b === 'blackalpha' ? DATA.ba_sizes : DATA.sx_sizes);
    } else {
      invEl.style.display = 'none';
    }
  }

  // 활성 pill 업데이트
  document.querySelectorAll('.mpill').forEach(el => {
    el.classList.toggle('active', el.dataset.ym === ym);
  });
}

function sel(el) { renderMonth(el.dataset.ym); }

// 채널 상세 토글 (메인은 총매출만, 버튼 누르면 해당 채널 상세 표시)
function showCh(ch) {
  const open = {coupang: document.getElementById('sec-coupang'),
                cafe24:  document.getElementById('sec-cafe24')};
  const btn = {coupang: document.getElementById('btn-coupang'),
               cafe24:  document.getElementById('btn-cafe24')};
  // 같은 버튼 다시 누르면 닫기(토글)
  const isOpen = open[ch].style.display !== 'none';
  for (const k in open) { open[k].style.display = 'none'; btn[k].classList.remove('active'); }
  if (!isOpen) { open[ch].style.display = ''; btn[ch].classList.add('active'); }
}

// 초기 렌더 (최신 월 또는 현재 월)
const initYm = DATA.months.includes(DATA.current_ym)
  ? DATA.current_ym
  : DATA.months[DATA.months.length - 1];
if (initYm) renderMonth(initYm);

// 활성 pill 화면에 보이도록 스크롤
const ap = document.querySelector('.mpill.active');
if (ap) ap.scrollIntoView({block:'nearest', inline:'center'});
</script>
