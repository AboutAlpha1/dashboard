<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F172A">
<title>어바웃알파 대시보드</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
  background:#F1F5F9;color:#0F172A;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── Header ── */
.header{
  background:linear-gradient(150deg,#0F172A 0%,#1E3A5F 60%,#1D4ED8 100%);
  color:#fff;padding:28px 20px 24px;position:sticky;top:0;z-index:10;
}
.header-brand{font-size:12px;font-weight:600;letter-spacing:2px;opacity:.6;text-transform:uppercase}
.header-month{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-0.5px}
.header-updated{font-size:11px;opacity:.45;margin-top:5px}

/* ── Layout ── */
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 40px}
.section-label{
  font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:#94A3B8;margin:22px 0 10px 2px
}

/* ── Summary grid ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{
  background:#fff;border-radius:16px;padding:18px 16px;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05)
}
.kpi-label{font-size:12px;font-weight:600;color:#64748B}
.kpi-value{font-size:26px;font-weight:800;margin-top:6px;line-height:1;letter-spacing:-1px}
.kpi-unit{font-size:14px;font-weight:500;color:#94A3B8;margin-left:1px}
.note{font-size:10px;font-weight:600;color:#F59E0B;background:#FEF3C7;
  padding:1px 5px;border-radius:4px;vertical-align:middle}

/* ── Brand card ── */
.card{
  background:#fff;border-radius:18px;padding:18px;margin-top:10px;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05)
}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-name{font-size:17px;font-weight:800;letter-spacing:-0.3px}
.inv-chip{
  background:#EEF2FF;color:#4338CA;font-size:13px;font-weight:700;
  padding:5px 12px;border-radius:20px;white-space:nowrap
}
.inv-chip span{font-size:11px;font-weight:500;color:#6366F1;margin-left:2px}
.brand-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.bm{text-align:center;padding:10px 4px;border-radius:10px;background:#F8FAFC}
.bm-label{font-size:11px;color:#94A3B8;font-weight:600;margin-bottom:5px}
.bm-value{font-size:16px;font-weight:800;letter-spacing:-0.5px}
.bm-unit{font-size:11px;font-weight:500;color:#94A3B8}

/* ── Inventory section ── */
.inv-card{
  background:#fff;border-radius:18px;padding:4px 0;margin-top:10px;
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05)
}
.inv-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px
}
.inv-row+.inv-row{border-top:1px solid #F1F5F9}
.inv-brand{font-size:15px;font-weight:700}
.inv-right{text-align:right}
.inv-count{font-size:28px;font-weight:900;color:#4338CA;letter-spacing:-1px;line-height:1}
.inv-unit{font-size:12px;color:#94A3B8;font-weight:500}

/* ── Footer ── */
.footer{text-align:center;color:#CBD5E1;font-size:11px;padding-top:28px}
</style>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="어바웃알파">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

  <!-- 재고 현황 -->

  <div class="footer">어바웃알파 · 2026-05-29 16:38</div>
</div>

<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');

</html>
